name: Build DhammaBell Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project if zipped
        run: |
          if [ -f "DhammaBellScheduler.zip" ]; then
            echo "Found DhammaBellScheduler.zip - extracting..."
            unzip -o DhammaBellScheduler.zip -d /tmp/extracted
            shopt -s dotglob
            cp -rf /tmp/extracted/DhammaBellScheduler/* .
            rm -rf /tmp/extracted DhammaBellScheduler.zip
            echo "Extraction complete."
          else
            echo "No zip found at repo root - assuming files were uploaded unzipped already."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Make Gradle executable
        run: chmod +x gradlew || true

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
