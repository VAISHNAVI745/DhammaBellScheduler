name: Build DhammaBell Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Mobile-friendly path: if you uploaded DhammaBellScheduler.zip directly
      # to the repo root instead of its unzipped contents, this step unpacks
      # it right here on the runner before the build - no folder upload needed.
      - name: Extract project if zipped
        run: |
          if [ -f "DhammaBellScheduler.zip" ]; then
            echo "Found DhammaBellScheduler.zip - extracting..."
            unzip -o DhammaBellScheduler.zip -d /tmp/extracted
            # The zip contains a top-level DhammaBellScheduler/ folder; move its
            # contents up to the repo root so gradlew/app/etc. land in place.
            shopt -s dotglob
            cp -rf /tmp/extracted/DhammaBellScheduler/* .
            rm -rf /tmp/extracted DhammaBellScheduler.zip
            echo "Extraction complete."
          else
            echo "No zip found at repo root - assuming files were uploaded unzipped already."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper is required - this action provisions Gradle
      # itself on the runner and caches it, so `gradle` is directly callable below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
